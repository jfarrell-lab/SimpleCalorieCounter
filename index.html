<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calorie Tracker</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
    background: #f5f5f5;
}

.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 15px;
    border-radius: 10px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* ✅ bigger daily limit */
#dailyLimitDisplay {
    font-size: 22px;
    font-weight: bold;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    font-size: 16px;
    border-radius: 5px;
    box-sizing: border-box;
}

button {
    background: #0078d4;
    color: white;
    border: none;
}

input {
    border: 1px solid #ccc;
}

.reset-btn {
    background: red;
    width: auto;
    padding: 8px 12px;
}

.delete {
    background: red;
    width: auto;
    margin-left: 10px;
}

li {
    background: #eee;
    padding: 8px;
    margin-top: 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.legend {
    background: #fafafa;
    padding: 10px;
    margin-top: 10px;
    font-size: 14px;
    border-radius: 5px;
}

#resetMsg {
    color: red;
    font-size: 12px;
    height: 16px;
}
</style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <h3>Daily Limit: <span id="dailyLimitDisplay"></span></h3>
        <button id="resetBtn" type="button" class="reset-btn">Reset</button>
    </div>

    <div id="resetMsg"></div>

    <h2>Remaining</h2>
    <h1 id="remaining">0</h1>

    <!-- ❌ WEEKLY TOTAL REMOVED -->

    <div class="legend">
        <strong>Meal Guide:</strong><br>
        Breakfast: 05:00 – 11:59<br>
        Dinner: 12:00 – 15:00<br>
        Tea: 15:01 – 19:00<br>
        Snack: All other times
    </div>

    <input type="number" id="calInput" placeholder="Enter calories" min="1">

    <button id="addBtn" type="button">Add Calories</button>

    <h3>Food Log</h3>
    <ul id="foodList"></ul>

    <!-- ✅ MONTH SUMMARY -->
    <h3>This Month</h3>
    <ul id="monthBreakdown"></ul>

    <!-- ✅ ARCHIVE -->
    <h3>Archive (All Entries)</h3>
    <ul id="archiveList"></ul>

</div>

<script>

let dailyLimit = 1350;
let caloriesUsed = 0;
let resetArmed = false;

/* Date helpers */
function getTodayKey() {
    return new Date().toDateString();
}

function getMonthKey() {
    let d = new Date();
    return d.getFullYear() + "-" + d.getMonth();
}

/* ✅ AUTO RESET */
function checkReset() {
    let today = getTodayKey();
    let lastDay = localStorage.getItem("lastDay");

    if (lastDay !== today) {
        caloriesUsed = 0;
        localStorage.setItem("lastDay", today);
    }

    let currentMonth = getMonthKey();
    let lastMonth = localStorage.getItem("lastMonth");

    if (lastMonth !== currentMonth) {
        localStorage.removeItem("tracker"); // full reset
        localStorage.setItem("lastMonth", currentMonth);
    }
}

/* Meal label */
function getMealLabel() {
    let now = new Date();
    let mins = now.getHours() * 60 + now.getMinutes();

    if (mins >= 300 && mins <= 719) return "Breakfast";
    if (mins >= 720 && mins <= 900) return "Dinner";
    if (mins >= 901 && mins <= 1140) return "Tea";
    return "Snack";
}

/* Load */
function loadData() {
    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    let today = getTodayKey();

    caloriesUsed = 0;
    foodList.innerHTML = "";

    if (data[today]) {
        caloriesUsed = data[today].total;

        data[today].items.forEach(item => {
            addItemToList(item.amount, item.label, item.time);
        });
    }

    updateDisplay();
    updateMonth();
    updateArchive();
}

/* Save */
function saveData() {
    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    let today = getTodayKey();

    let items = [];
    document.querySelectorAll("#foodList li").forEach(li => {
        items.push({
            amount: parseInt(li.dataset.amount),
            label: li.dataset.label,
            time: li.dataset.time
        });
    });

    data[today] = {
        total: caloriesUsed,
        items: items
    };

    localStorage.setItem("tracker", JSON.stringify(data));
}

/* ✅ ADD */
function addCalories() {
    let amount = parseInt(calInput.value);

    if (!amount || amount <= 0) return;

    let label = getMealLabel();
    let time = new Date().toLocaleString();

    caloriesUsed += amount;
    addItemToList(amount, label, time);

    calInput.value = "";
    updateDisplay();
    saveData();
    updateMonth();
    updateArchive();
}

/* ✅ ITEM with timestamp */
function addItemToList(amount, label, time) {
    let li = document.createElement("li");
    li.dataset.amount = amount;
    li.dataset.label = label;
    li.dataset.time = time;

    let text = document.createElement("span");
    text.innerText = `${label}: ${amount} kcal (${time})`;

    let btn = document.createElement("button");
    btn.innerText = "X";
    btn.className = "delete";

    btn.onclick = () => {
        caloriesUsed -= amount;
        li.remove();
        updateDisplay();
        saveData();
        updateMonth();
        updateArchive();
    };

    li.appendChild(text);
    li.appendChild(btn);

    foodList.appendChild(li);
}

/* ✅ MONTH VIEW */
function updateMonth() {
    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    let month = new Date().getMonth();

    let list = [];

    for (let key in data) {
        let d = new Date(key);
        if (d.getMonth() !== month) continue;

        let name = d.toLocaleDateString("en-GB");
        let total = data[key].total;

        list.push(`<li>${name}: ${total} kcal</li>`);
    }

    monthBreakdown.innerHTML = list.join("");
}

/* ✅ ARCHIVE */
function updateArchive() {
    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    let list = [];

    for (let day in data) {
        data[day].items.forEach(item => {
            list.push(`<li>${item.time} - ${item.amount} kcal</li>`);
        });
    }

    archiveList.innerHTML = list.join("");
}

/* Reset */
function resetDay() {
    if (!resetArmed) {
        resetMsg.innerText = "Tap reset again to confirm";
        resetArmed = true;

        setTimeout(() => {
            resetArmed = false;
            resetMsg.innerText = "";
        }, 3000);
        return;
    }

    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    let today = getTodayKey();

    delete data[today];
    localStorage.setItem("tracker", JSON.stringify(data));

    caloriesUsed = 0;
    foodList.innerHTML = "";

    resetArmed = false;
    resetMsg.innerText = "";

    updateDisplay();
    updateMonth();
    updateArchive();
}

/* UI */
function updateDisplay() {
    remaining.innerText = dailyLimit - caloriesUsed;
    dailyLimitDisplay.innerText = dailyLimit;
}

/* Events */
addBtn.onclick = addCalories;
resetBtn.onclick = resetDay;

/* Init */
checkReset();
loadData();

</script>

</body>
</html>
