<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial;
    padding: 20px;
    background: #f5f5f5;
    font-size: 18px;
}

.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 15px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-height: 85vh;
}

ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

.main-title {
    font-size: 32px;
    font-weight: bold;
    text-align: center;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#remaining {
    font-size: 46px;
    text-align: center;
}

h2 {
    text-align: center;
    font-size: 24px;
}

h3 {
    font-size: 20px;
}

input, button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    font-size: 20px;
    border-radius: 5px;
    box-sizing: border-box;
}

button {
    background: #0078d4;
    color: white;
    border: none;
}

.reset-btn {
    background: red;
    width: auto;
}

.delete {
    color: red;
    font-weight: bold;
    background: none;
    border: none;
    padding: 0;
    margin-left: 10px;
    font-size: 18px;
    cursor: pointer;
}

li {
    background: #eee;
    padding: 6px 10px;
    margin-top: 6px;
    font-size: 20px;
}

.item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.calories {
    min-width: 100px;
    text-align: right;
    white-space: nowrap;
    margin-right: 6px;
    font-size: 20px;
}

/* ✅ Today's log emphasis */
#foodList li {
    font-size: 23px;
}

#foodList .calories {
    font-size: 23px;
}

.warn {
    color: red;
    font-size: 18px;
    display: none;
}

#archiveList {
    margin-bottom: 10px;
}

.restore-bar {
    margin-top: auto;
    background: #0078d4;
    color: white;
    text-align: center;
    padding: 14px;
    cursor: pointer;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="container">

<div class="main-title">Karen's Calorie Tracker</div>

<div class="top-bar">
    <h3>Daily Limit: <span id="dailyLimitDisplay">0</span></h3>
    <button id="resetBtn" class="reset-btn">Reset</button>
</div>

<div id="resetMsg" style="color:red; height:16px;"></div>

<h2>Remaining</h2>
<h1 id="remaining">0</h1>

<!-- ✅ Only allow positive numbers -->
<input type="number" id="calInput" min="1" step="1">
<button id="addBtn">Add Calories</button>

<h3>Today's Food Log</h3>
<ul id="foodList"></ul>

<h3>This Month's Summary</h3>
<ul id="monthBreakdown"></ul>

<h3>This Month's Detailed</h3>
<ul id="archiveList"></ul>

<div id="restoreBar" class="restore-bar">Restore Backup</div>

</div>

<script>
let dailyLimit = 1350;
let caloriesUsed = 0;

let resetTapCount = 0;
let restoreTapCount = 0;
let restoreActive = false;

function getTodayKey() {
    return new Date().toDateString();
}

function loadData() {
    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    let today = getTodayKey();

    caloriesUsed = 0;
    foodList.innerHTML = "";

    if (data[today]) {
        caloriesUsed = data[today].total;
        data[today].items.forEach(item => {
            addItemToList(item.amount, item.time);
        });
    }

    updateDisplay();
    updateMonth();
    updateArchive();
}

function saveData() {
    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    let today = getTodayKey();

    let items = [];
    document.querySelectorAll("#foodList li").forEach(li => {
        items.push({
            amount: parseInt(li.dataset.amount),
            time: li.dataset.time
        });
    });

    data[today] = { total: caloriesUsed, items: items };
    localStorage.setItem("tracker", JSON.stringify(data));
}

function addCalories() {
    let amount = parseInt(calInput.value);

    // ✅ Block zero & negative numbers
    if (!amount || amount <= 0) return;

    let time = new Date().toLocaleString();

    caloriesUsed += amount;
    addItemToList(amount, time);

    calInput.value = "";
    updateDisplay();
    saveData();
    updateMonth();
    updateArchive();
}

function addItemToList(amount, time) {

    let li = document.createElement("li");
    let deleteTap = 0;

    let row = document.createElement("div");
    row.className = "item-row";

    let cleanTime = time.includes(", ") ? time.split(", ")[1] : time;
    cleanTime = cleanTime.slice(0,5);

    let left = document.createElement("span");
    left.innerHTML = "<strong>" + cleanTime + "</strong>";

    let rightWrap = document.createElement("div");
    rightWrap.style.display = "flex";
    rightWrap.style.alignItems = "center";

    let cal = document.createElement("span");
    cal.className = "calories";
    cal.innerText = amount + " kcal";

    let btn = document.createElement("button");
    btn.innerText = "X";
    btn.className = "delete";

    let warn = document.createElement("div");
    warn.className = "warn";

    btn.onclick = () => {
        deleteTap++;

        if (deleteTap < 3) {
            warn.style.display = "block";
            warn.innerText = `Tap delete ${3 - deleteTap} more`;
            return;
        }

        caloriesUsed -= amount;
        li.remove();

        updateDisplay();
        saveData();
        updateMonth();
        updateArchive();
    };

    rightWrap.appendChild(cal);
    rightWrap.appendChild(btn);

    row.appendChild(left);
    row.appendChild(rightWrap);

    li.dataset.amount = amount;
    li.dataset.time = time;

    li.appendChild(row);
    li.appendChild(warn);

    foodList.appendChild(li);
}

function updateMonth() {
    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    let list = [];

    for (let key in data) {
        let name = new Date(key).toLocaleDateString("en-GB");
        let total = data[key].total;

        let color = total <= dailyLimit ? "darkgreen" : "darkred";
        list.push(`<li style="color:${color}; font-weight:bold">${name}: ${total} kcal</li>`);
    }

    monthBreakdown.innerHTML = list.join("");
}

function updateArchive() {
    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    let list = [];

    for (let day in data) {
        let date = new Date(day).toLocaleDateString("en-GB");

        data[day].items.forEach(item => {
            let t = item.time.includes(", ")
                ? item.time.split(", ")[1]
                : item.time;

            t = t.slice(0,5);

            list.push(`<li><strong>${date}: ${t}</strong><br>${item.amount} kcal</li>`);
        });
    }

    archiveList.innerHTML = list.join("");
}

function resetDay() {
    resetTapCount++;

    if (resetTapCount < 5) {
        resetMsg.innerText = `Tap reset ${5 - resetTapCount} more`;
        return;
    }

    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    delete data[getTodayKey()];
    localStorage.setItem("tracker", JSON.stringify(data));

    caloriesUsed = 0;
    foodList.innerHTML = "";

    resetTapCount = 0;
    resetMsg.innerText = "";

    updateDisplay();
    updateMonth();
    updateArchive();
}

function restoreBackup() {
    if (restoreActive) return;

    restoreTapCount++;

    if (restoreTapCount < 3) {
        restoreBar.innerText = `Tap restore ${3 - restoreTapCount} more`;
        return;
    }

    restoreActive = true;
    restoreBar.innerText = "Restoring...";

    let backup = localStorage.getItem("tracker_backup");
    if (backup) localStorage.setItem("tracker", backup);

    loadData();

    restoreBar.innerText = "Restore Complete";

    setTimeout(() => {
        restoreBar.innerText = "Restore Backup";
        restoreTapCount = 0;
        restoreActive = false;
    }, 2000);
}

function updateDisplay() {
    let remainingValue = dailyLimit - caloriesUsed;

    remaining.innerText = remainingValue;
    dailyLimitDisplay.innerText = dailyLimit;

    remaining.style.color = caloriesUsed <= dailyLimit ? "darkgreen" : "darkred";
}

addBtn.onclick = addCalories;
resetBtn.onclick = resetDay;
restoreBar.onclick = restoreBackup;

loadData();
</script>

</body>
</html>
