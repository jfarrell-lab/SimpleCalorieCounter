<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Calorie Counter</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

/* BIGGER daily limit */
#dailyLimit {
    font-size: 32px;
    font-weight: bold;
    color: #2c3e50;
}

input, button {
    padding: 10px;
    margin: 5px;
}

button {
    cursor: pointer;
}

/* Archive section */
#archive {
    margin-top: 40px;
    padding: 15px;
    background: white;
    border: 1px solid #ccc;
}
</style>
</head>

<body>

<h1>Calorie Counter</h1>

<div id="dailyLimit">Daily Calories: 0 / 2000</div>

<br>

<input id="food" placeholder="Food name">
<input id="calories" type="number" placeholder="Calories">
<button onclick="addItem()">Add</button>

<button onclick="resetDay()">Reset Day</button>

<h2>Archive (All Entries)</h2>
<div id="archive"></div>


<script>
let DAILY_LIMIT = 2000;

let data = JSON.parse(localStorage.getItem("calorieData")) || {
    currentCalories: 0,
    entries: [],
    lastDay: "",
    lastMonth: ""
};


/* ------------------ DATE HELPERS ------------------ */
function getToday() {
    return new Date().toISOString().split("T")[0];
}

function getMonth() {
    return new Date().getMonth();
}


/* ------------------ AUTO RESET LOGIC ------------------ */
function checkResets() {
    let today = getToday();
    let month = getMonth();

    // Daily reset at midnight
    if (data.lastDay !== today) {
        data.currentCalories = 0;
        data.lastDay = today;
    }

    // Monthly reset (1st at 00:01 effectively)
    if (data.lastMonth !== month) {
        data.entries = [];
        data.currentCalories = 0;
        data.lastMonth = month;
    }

    save();
}


/* ------------------ SAVE ------------------ */
function save() {
    localStorage.setItem("calorieData", JSON.stringify(data));
}


/* ------------------ DISPLAY ------------------ */
function render() {
    document.getElementById("dailyLimit").innerText =
        `Daily Calories: ${data.currentCalories} / ${DAILY_LIMIT}`;

    let archiveHTML = "";

    data.entries.forEach(e => {
        archiveHTML += `
            <div>
                ${e.time} - ${e.name} (${e.calories} kcal)
            </div>
        `;
    });

    document.getElementById("archive").innerHTML = archiveHTML;
}


/* ------------------ ADD ITEM ------------------ */
function addItem() {
    let food = document.getElementById("food").value;
    let cal = parseInt(document.getElementById("calories").value);

    if (!food || !cal) return;

    let now = new Date();

    let entry = {
        name: food,
        calories: cal,
        time: now.toLocaleString()   // ✅ date + time added
    };

    data.entries.push(entry);
    data.currentCalories += cal;

    save();
    render();

    document.getElementById("food").value = "";
    document.getElementById("calories").value = "";
}


/* ------------------ MANUAL RESET ------------------ */
function resetDay() {
    data.currentCalories = 0;
    save();
    render();
}


/* ------------------ INIT ------------------ */
checkResets();
render();
</script>

</body>
</html>
