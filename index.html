<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Calorie Counter</title>

<style>
body {
    font-family: Arial;
    text-align: center;
}

/* Bigger daily limit text */
#dailyDisplay {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 15px;
}

.section {
    margin-top: 25px;
}
</style>
</head>

<body>

<h2>Simple Calorie Counter</h2>

<div id="dailyDisplay">0 / 2000</div>

<input id="calories" type="number" placeholder="Calories">
<button onclick="addCalories()">Add</button>
<button onclick="resetDay()">Reset Day</button>

<!-- MONTHLY SUMMARY -->
<div class="section">
    <h3>Monthly Summary (Daily Totals)</h3>
    <div id="monthSummary"></div>
</div>

<!-- MONTHLY DETAILED LOG -->
<div class="section">
    <h3>Monthly Detailed Log</h3>
    <div id="monthLog"></div>
</div>

<script>
const DAILY_LIMIT = 2000;

let currentCalories = parseInt(localStorage.getItem("currentCalories")) || 0;
let entries = JSON.parse(localStorage.getItem("entries")) || [];
let dailyTotals = JSON.parse(localStorage.getItem("dailyTotals")) || {};

/* ---------- DATE CHECKS ---------- */
function getToday() {
    return new Date().toISOString().split("T")[0];
}

function getMonthKey() {
    let d = new Date();
    return d.getFullYear() + "-" + d.getMonth();
}

/* ---------- RESETS ---------- */
function checkResets() {
    let today = getToday();
    let storedDay = localStorage.getItem("lastDay");

    // DAILY RESET (midnight)
    if (storedDay !== today) {
        currentCalories = 0;
        localStorage.setItem("lastDay", today);
    }

    let thisMonth = getMonthKey();
    let storedMonth = localStorage.getItem("lastMonth");

    // MONTHLY RESET (1st of month)
    if (storedMonth !== thisMonth) {
        entries = [];
        dailyTotals = {};
        currentCalories = 0;
        localStorage.setItem("lastMonth", thisMonth);
    }
}

/* ---------- ADD ---------- */
function addCalories() {
    let calInput = document.getElementById("calories");
    let calories = parseInt(calInput.value);

    if (!calories) return;

    let now = new Date();
    let today = getToday();

    // ✅ store entry WITH timestamp
    let entry = {
        calories: calories,
        time: now.toLocaleString()
    };

    entries.push(entry);

    // update daily totals
    if (!dailyTotals[today]) dailyTotals[today] = 0;
    dailyTotals[today] += calories;

    currentCalories += calories;

    save();
    render();

    calInput.value = "";
}

/* ---------- RESET TODAY ---------- */
function resetDay() {
    let today = getToday();
    currentCalories = 0;
    dailyTotals[today] = 0;
    save();
    render();
}

/* ---------- SAVE ---------- */
function save() {
    localStorage.setItem("currentCalories", currentCalories);
    localStorage.setItem("entries", JSON.stringify(entries));
    localStorage.setItem("dailyTotals", JSON.stringify(dailyTotals));
}

/* ---------- RENDER ---------- */
function render() {
    // Top (no weekly total)
    document.getElementById("dailyDisplay").innerText =
        currentCalories + " / " + DAILY_LIMIT;

    /* MONTHLY SUMMARY */
    let summaryHTML = "";
    Object.keys(dailyTotals).sort().forEach(day => {
        summaryHTML += `<div>${day} : ${dailyTotals[day]} kcal</div>`;
    });
    document.getElementById("monthSummary").innerHTML = summaryHTML;

    /* MONTHLY LOG */
    let logHTML = "";
    entries.forEach(e => {
        logHTML += `<div>${e.time} - ${e.calories} kcal</div>`;
    });
    document.getElementById("monthLog").innerHTML = logHTML;
}

/* ---------- INIT ---------- */
checkResets();
render();
</script>

</body>
</html>
