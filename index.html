<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calorie Counter</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
    background: #f4f4f4;
}

h1 {
    text-align: center;
}

/* BIG daily display */
#dailyDisplay {
    font-size: 36px;
    font-weight: bold;
    color: #2c3e50;
}

/* sections */
.section {
    margin-top: 30px;
    background: white;
    padding: 15px;
    border: 1px solid #ccc;
}
</style>
</head>

<body>

<h1>Calorie Counter</h1>

<div id="dailyDisplay">0 / 2000</div>

<br>

<input id="food" placeholder="Food">
<input id="calories" type="number" placeholder="Calories">
<button onclick="addItem()">Add</button>

<button onclick="resetDay()">Reset Today</button>

<!-- MONTHLY SUMMARY -->
<div class="section">
    <h2>Monthly Summary (Daily Totals)</h2>
    <div id="monthlySummary"></div>
</div>

<!-- MONTHLY DETAILED -->
<div class="section">
    <h2>Monthly Detailed Log (All Entries)</h2>
    <div id="monthlyLog"></div>
</div>

<script>
const DAILY_LIMIT = 2000;

let data = JSON.parse(localStorage.getItem("calData")) || {
    entries: [],
    dailyTotals: {},
    lastDay: "",
    lastMonth: ""
};

/* ---------- DATE HELPERS ---------- */
function todayStr() {
    return new Date().toISOString().split("T")[0];
}

function monthStr() {
    const d = new Date();
    return d.getFullYear() + "-" + d.getMonth();
}

/* ---------- RESET LOGIC ---------- */
function checkReset() {
    let today = todayStr();
    let month = monthStr();

    // DAILY RESET
    if (data.lastDay !== today) {
        data.lastDay = today;
    }

    // MONTH RESET
    if (data.lastMonth !== month) {
        data.entries = [];
        data.dailyTotals = {};
        data.lastMonth = month;
    }

    save();
}

/* ---------- SAVE ---------- */
function save() {
    localStorage.setItem("calData", JSON.stringify(data));
}

/* ---------- ADD ITEM ---------- */
function addItem() {
    let name = document.getElementById("food").value;
    let cal = parseInt(document.getElementById("calories").value);

    if (!name || !cal) return;

    let now = new Date();

    let date = now.toISOString().split("T")[0];

    let entry = {
        name,
        calories: cal,
        date,
        time: now.toLocaleString() // ✅ FULL DATE + TIME
    };

    data.entries.push(entry);

    // update daily total
    if (!data.dailyTotals[date]) data.dailyTotals[date] = 0;
    data.dailyTotals[date] += cal;

    save();
    render();

    document.getElementById("food").value = "";
    document.getElementById("calories").value = "";
}

/* ---------- RESET TODAY ---------- */
function resetDay() {
    let today = todayStr();
    data.dailyTotals[today] = 0;
    save();
    render();
}

/* ---------- RENDER ---------- */
function render() {
    let today = todayStr();
    let todayTotal = data.dailyTotals[today] || 0;

    // top display (NO weekly anything)
    document.getElementById("dailyDisplay").innerText =
        `${todayTotal} / ${DAILY_LIMIT}`;

    /* MONTHLY SUMMARY */
    let summaryHTML = "";
    Object.keys(data.dailyTotals)
        .sort()
        .forEach(day => {
            summaryHTML += `<div>${day} : ${data.dailyTotals[day]} kcal</div>`;
        });
    document.getElementById("monthlySummary").innerHTML = summaryHTML;

    /* MONTHLY LOG */
    let logHTML = "";
    data.entries.forEach(e => {
        logHTML += `<div>${e.time} - ${e.name} (${e.calories} kcal)</div>`;
    });
    document.getElementById("monthlyLog").innerHTML = logHTML;
}

/* ---------- INIT ---------- */
checkReset();
render();
</script>

</body>
</html>
