<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calorie Tracker</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
    background: #f5f5f5;
}

.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 15px;
    border-radius: 10px;
}

.main-title {
    font-size: 30px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 10px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#dailyLimitDisplay {
    font-size: 24px;
    font-weight: bold;
}

input, button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    font-size: 18px;
    border-radius: 5px;
    box-sizing: border-box;
}

button {
    background: #0078d4;
    color: white;
    border: none;
}

input {
    border: 1px solid #ccc;
}

#remaining {
    font-size: 42px;
    font-weight: bold;
}

.reset-btn {
    background: red;
    width: auto;
    padding: 8px 12px;
}

.delete {
    background: red;
    width: auto;
    margin-left: 10px;
}

li {
    background: #eee;
    padding: 12px;
    margin-top: 6px;
    font-size: 18px;
    display: flex;
    flex-direction: column;
}

.item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.legend {
    background: #fafafa;
    padding: 10px;
    margin-top: 10px;
    font-size: 16px;
    border-radius: 5px;
}

#resetMsg {
    color: red;
    font-size: 14px;
    height: 20px;
}
</style>
</head>

<body>

<div class="container">

    <div class="main-title">Karen's Calorie Tracker</div>

    <div class="top-bar">
        <h3>Daily Limit: <span id="dailyLimitDisplay"></span></h3>
        <button id="resetBtn" class="reset-btn">Reset</button>
    </div>

    <div id="resetMsg"></div>

    <h2>Remaining</h2>
    <h1 id="remaining">0</h1>

    <div class="legend">
        <strong>Meal Guide:</strong><br>
        Breakfast: 05:00 – 11:59<br>
        Dinner: 12:00 – 15:00<br>
        Tea: 15:01 – 19:00<br>
        Snack: All other times
    </div>

    <input type="number" id="calInput" placeholder="Enter calories" min="1">
    <button id="addBtn">Add Calories</button>

    <h3>Today's Food Log</h3>
    <ul id="foodList"></ul>

    <h3>This Month's Summary</h3>
    <ul id="monthBreakdown"></ul>

    <h3>This Month's Detailed</h3>
    <ul id="archiveList"></ul>

</div>

<script>

let dailyLimit = 1350;
let caloriesUsed = 0;

let resetTapCount = 0;

/* Date */
function getTodayKey() {
    return new Date().toDateString();
}

function getMonthKey() {
    let d = new Date();
    return d.getFullYear() + "-" + d.getMonth();
}

/* Reset check */
function checkReset() {
    let today = getTodayKey();
    let lastDay = localStorage.getItem("lastDay");

    if (lastDay !== today) {
        caloriesUsed = 0;
        foodList.innerHTML = "";
        localStorage.setItem("lastDay", today);
    }

    let currentMonth = getMonthKey();
    let lastMonth = localStorage.getItem("lastMonth");

    if (lastMonth !== currentMonth) {
        localStorage.removeItem("tracker");
        localStorage.setItem("lastMonth", currentMonth);
    }
}

/* Meal */
function getMealLabel() {
    let now = new Date();
    let mins = now.getHours() * 60 + now.getMinutes();

    if (mins >= 300 && mins <= 719) return "Breakfast";
    if (mins >= 720 && mins <= 900) return "Dinner";
    if (mins >= 901 && mins <= 1140) return "Tea";
    return "Snack";
}

/* Load */
function loadData() {
    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    let today = getTodayKey();

    caloriesUsed = 0;
    foodList.innerHTML = "";

    if (data[today]) {
        caloriesUsed = data[today].total;

        data[today].items.forEach(item => {
            addItemToList(item.amount, item.label, item.time);
        });
    }

    updateDisplay();
    updateMonth();
    updateArchive();
}

/* Save */
function saveData() {
    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    let today = getTodayKey();

    let items = [];
    document.querySelectorAll("#foodList li").forEach(li => {
        items.push({
            amount: parseInt(li.dataset.amount),
            label: li.dataset.label,
            time: li.dataset.time
        });
    });

    data[today] = {
        total: caloriesUsed,
        items: items
    };

    localStorage.setItem("tracker", JSON.stringify(data));
}

/* Add */
function addCalories() {
    let amount = parseInt(calInput.value);
    if (!amount || amount <= 0) return;

    let label = getMealLabel();
    let time = new Date().toLocaleString();

    caloriesUsed += amount;
    addItemToList(amount, label, time);

    calInput.value = "";
    updateDisplay();
    saveData();
    updateMonth();
    updateArchive();
}

/* ✅ Item with red warning delete */
function addItemToList(amount, label, time) {
    let li = document.createElement("li");

    let deleteTap = 0;

    let row = document.createElement("div");
    row.className = "item-row";

    let text = document.createElement("span");
    text.innerText = `${label}: ${amount} kcal (${time})`;

    let btn = document.createElement("button");
    btn.innerText = "X";
    btn.className = "delete";

    let warn = document.createElement("div");
    warn.style.color = "red";
    warn.style.fontSize = "14px";

    btn.onclick = () => {
        deleteTap++;

        if (deleteTap < 3) {
            warn.innerText = `Tap delete ${3 - deleteTap} more time${(3 - deleteTap)>1?"s":""}`;
            return;
        }

        caloriesUsed -= amount;
        li.remove();
        updateDisplay();
        saveData();
        updateMonth();
        updateArchive();
    };

    row.appendChild(text);
    row.appendChild(btn);

    li.dataset.amount = amount;
    li.dataset.label = label;
    li.dataset.time = time;

    li.appendChild(row);
    li.appendChild(warn);

    foodList.appendChild(li);
}

/* Month summary */
function updateMonth() {
    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    let month = new Date().getMonth();
    let list = [];

    for (let key in data) {
        let d = new Date(key);
        if (d.getMonth() !== month) continue;

        let name = d.toLocaleDateString("en-GB");
        let total = data[key].total;

        let color = (total <= dailyLimit) ? "darkgreen" : "darkred";
        list.push(`<li style="color:${color}; font-weight:bold">${name}: ${total} kcal</li>`);
    }

    monthBreakdown.innerHTML = list.join("");
}

/* Archive */
function updateArchive() {
    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    let month = new Date().getMonth();
    let list = [];

    for (let day in data) {
        let d = new Date(day);
        if (d.getMonth() !== month) continue;

        data[day].items.forEach(item => {
            list.push(`<li>${item.time} - ${item.amount} kcal</li>`);
        });
    }

    archiveList.innerHTML = list.join("");
}

/* ✅ 5 tap reset */
function resetDay() {
    resetTapCount++;

    if (resetTapCount < 5) {
        resetMsg.innerText = `Tap reset ${5 - resetTapCount} more times…`;
        return;
    }

    let data = JSON.parse(localStorage.getItem("tracker")) || {};
    let today = getTodayKey();

    delete data[today];
    localStorage.setItem("tracker", JSON.stringify(data));

    caloriesUsed = 0;
    foodList.innerHTML = "";

    resetTapCount = 0;
    resetMsg.innerText = "";

    updateDisplay();
    updateMonth();
    updateArchive();
}

/* Display */
function updateDisplay() {
    let remainingValue = dailyLimit - caloriesUsed;
    remaining.innerText = remainingValue;
    dailyLimitDisplay.innerText = dailyLimit;

    if (caloriesUsed <= dailyLimit) {
        remaining.style.color = "darkgreen";
    } else {
        remaining.style.color = "darkred";
    }
}

/* Events */
addBtn.onclick = addCalories;
resetBtn.onclick = resetDay;

/* Init */
checkReset();
loadData();

</script>

</body>
</html>
